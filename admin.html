<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Maggie's Treat</title>
<link rel="stylesheet" href="styles.css">
<style>
body{display:block!important;background:#f7f1e8;min-height:100vh}
.hidden{display:none!important}
.login-panel{max-width:480px;margin:40px auto;background:#fff;padding:32px;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.login-panel input{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;margin:8px 0 16px}
.button{width:100%;padding:14px;border-radius:999px;background:#ff7900;color:#fff;border:0;font-weight:700;cursor:pointer}
.error{color:#b00;background:#ffe6e6;padding:12px;border-radius:8px;margin:10px 0}
.order-card,.stat-card{background:#fff;padding:16px;margin:10px 0;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.order-items{list-style:none;padding:0}
.order-items li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eee}
</style>
</head>
<body>
<header style="padding:16px;display:flex;justify-content:space-between;background:#fff"><a href="index.html"><strong>MAGGIE'S TREAT</strong></a><div><button id="logoutBtn" class="hidden" style="padding:8px 16px;border-radius:999px;border:1px solid #ddd;background:#fff">Log out</button></div></header>
<main style="padding:20px;max-width:1200px;margin:0 auto">
<div id="loginPanel" class="login-panel">
<h2>Welcome back.</h2>
<div id="loginMessage"></div>
<form id="loginForm">
<label>Admin email</label><input id="loginEmail" type="email" value="plethabo434@gmail.com" required>
<label>Password</label><input id="loginPassword" type="password" required>
<button class="button" type="submit">Sign in to dashboard →</button>
</form>
</div>
<div id="dashboardPanel" class="hidden">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px">
<h1>Store dashboard</h1><button id="refreshBtn" style="padding:10px 18px;border-radius:999px;border:0;background:#111;color:#fff">Refresh</button>
</div>
<div id="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px"></div>
<h2 style="margin-top:24px">Orders</h2>
<select id="filter" style="padding:8px 12px;border-radius:999px"><option value="all">All</option><option value="new">New</option><option value="preparing">Preparing</option><option value="ready">Ready</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select>
<div id="ordersList" style="margin-top:12px"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://texzgslhswsyooixscmz.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRleHpnc2xoc3dzeW9vaXhzY216Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMDE2NDEsImV4cCI6MjEwNzY3NzY0MX0.Ui612PvVsw3jpT_WnR3U4ve8zNpYfcdHSd7KfuKv9U8';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let orders=[];
$('loginForm').onsubmit=async(e)=>{
  e.preventDefault();
  $('loginMessage').textContent='Signing in…';
  const email=$('loginEmail').value.trim().toLowerCase();
  const password=$('loginPassword').value;
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){ $('loginMessage').innerHTML='<div class=error>'+error.message+'</div>'; return; }
  openDash();
};
$('logoutBtn').onclick=async()=>{ await db.auth.signOut(); location.reload(); };
$('refreshBtn').onclick=load;
$('filter').onchange=render;
async function openDash(){ $('loginPanel').classList.add('hidden'); $('dashboardPanel').classList.remove('hidden'); $('logoutBtn').classList.remove('hidden'); await load(); }
async function load(){
  $('ordersList').innerHTML='Loading…';
  try{
    const {data:ordersData,error:oErr}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
    if(oErr) throw oErr;
    orders=ordersData;
    let revToday=0, revWeek=0, revMonth=0, todayCount=0;
    const now=new Date(); const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const startWeek=new Date(now); startWeek.setDate(now.getDate()-7);
    const startMonth=new Date(now.getFullYear(),now.getMonth(),1);
    orders.forEach(o=>{ const d=new Date(o.created_at); const tot=Number(o.total||0); if(d>=startToday){revToday+=tot; todayCount++} if(d>=startWeek) revWeek+=tot; if(d>=startMonth) revMonth+=tot; });
    $('stats').innerHTML=`<div class=stat-card><small>Revenue Today</small><h2>R ${revToday.toFixed(2)}</h2></div><div class=stat-card><small>Revenue Week</small><h2>R ${revWeek.toFixed(2)}</h2></div><div class=stat-card><small>Revenue Month</small><h2>R ${revMonth.toFixed(2)}</h2></div><div class=stat-card><small>Orders Today</small><h2>${todayCount}</h2></div>`;
    render();
  }catch(err){ $('ordersList').innerHTML='<div class=error>'+err.message+'</div>'; }
}
function render(){
  const f=$('filter').value; let list=f==='all'?orders:orders.filter(o=>o.status===f);
  if(!list.length){ $('ordersList').innerHTML='<p>No orders.</p>'; return; }
  $('ordersList').innerHTML=list.map(o=>{
    const items=Array.isArray(o.item_details)?o.item_details.map(i=>`<li><span>${i.quantity}× ${i.name}</span><span>R${(i.line_total||i.price*i.quantity).toFixed(2)}</span></li>`).join(''):'';
    return `<div class=order-card><div style="display:flex;justify-content:space-between"><b>${o.customer_name}</b><b>R${Number(o.total).toFixed(2)}</b></div><small>${new Date(o.created_at).toLocaleString('en-ZA')}</small><ul class=order-items>${items}</ul><small>${o.phone||''}</small><div style="margin-top:8px"><select onchange="updateStatus('${o.id}',this.value)"><option value="new" ${o.status==='new'?'selected':''}>New</option><option value="preparing" ${o.status==='preparing'?'selected':''}>Preparing</option><option value="ready" ${o.status==='ready'?'selected':''}>Ready</option><option value="completed" ${o.status==='completed'?'selected':''}>Completed</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option></select></div></div>`;
  }).join('');
}
window.updateStatus=async(id,status)=>{ await db.from('orders').update({status}).eq('id',id); load(); };
(async()=>{ const {data:{session}}=await db.auth.getSession(); if(session) openDash(); })();
</script>
</body>
</html>
