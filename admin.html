<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maggie's Treat — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{margin:0;background:#fbf6ee;min-height:100vh;color:#1e1a15}
.hidden{display:none!important}
.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:420px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.08);border:1px solid #f0e6d8}
.login input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid #f0e6d8;background:#fdfaf5;margin:8px 0 12px;font-size:15px;outline:none}
.login input:focus{border-color:#ff7900;background:#fff}
.btn-orange{width:100%;padding:15px;border-radius:999px;background:#ff7900;color:#fff;border:0;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(255,121,0,.3)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid #f0e6d8;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1250px;margin:0 auto;padding:24px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0}
.kpi{background:#fff;border:1px solid #f0e6d8;border-radius:20px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.kpi small{color:#8a7f72;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.kpi h2{margin:10px 0 4px;font-size:42px;letter-spacing:-2px;line-height:1}
.orders-wrap{background:#fff;border:1px solid #f0e6d8;border-radius:24px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tab{padding:10px 16px;border-radius:999px;border:1.5px solid #f0e6d8;background:#fffefb;font-weight:700;cursor:pointer}
.tab.active{background:#ff7900;color:#fff;border-color:#ff7900}
.grid{ display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px }
.ocard{background:#fff;border:1px solid #f5eee4;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.03);transition:.2s}
.ocard:hover{border-color:#ff7900;box-shadow:0 8px 24px rgba(255,121,0,.12)}
.badge{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase}
.b-new{background:#ff7900;color:#fff}.b-preparing{background:#e8f0ff;color:#2d5bd1}.b-ready{background:#e6f9ed;color:#0a7a2e}.b-completed{background:#111;color:#fff}.b-cancelled{background:#ffe2e2;color:#a00}
.btn-done{width:100%;margin-top:12px;background:#111;color:#fff;border:0;padding:12px;border-radius:999px;font-weight:800;cursor:pointer}
.btn-done:hover{background:#ff7900}
.btn-ghost{padding:8px 14px;border-radius:999px;border:1px solid #e8ddd0;background:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<!-- ONE LOGIN ONLY, NO EMAIL -->
<div id="loginPanel" class="wrap">
<div class="login">
<h2 style="margin:0 0 6px;letter-spacing:-1px">Welcome back.</h2>
<p style="color:#8a7f72;font-size:14px;margin:0 0 18px">Maggie's Treat — Admin</p>
<div id="msg"></div>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin email" required>
<input id="pass" type="password" placeholder="Password" required>
<button class="btn-orange" type="submit">Sign in →</button>
</form>
</div>
</div>

<!-- BEAUTIFUL DASHBOARD NO GRAPH NO ALERTS -->
<div id="dash" class="hidden">
<header><div style="font-weight:800;display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;background:#ff7900;border-radius:10px;display:grid;place-items:center;color:#fff">🧁</span> MAGGIE'S TREAT</div><button id="out" class="btn-ghost">Log out</button></header>
<main>
<h1 style="font-size:30px;letter-spacing:-1.2px;margin:8px 0 4px">Dashboard</h1>
<p style="color:#8a7f72;margin:0 0 18px">Overview and orders</p>

<div id="kpis" class="kpis"></div>

<div class="orders-wrap">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h2 style="margin:0;letter-spacing:-1px">Orders</h2><div style="display:flex;gap:8px"><select id="filter" class="btn-ghost"><option value="all">All</option><option value="new">New</option><option value="preparing">Preparing</option><option value="ready">Ready</option><option value="completed">Completed</option></select><button id="export" class="btn-ghost">Export</button></div></div>
<div class="tabs"><button class="tab active" data-f="all">All</button><button class="tab" data-f="new">New</button><button class="tab" data-f="preparing">Preparing</button><button class="tab" data-f="ready">Ready</button><button class="tab" data-f="completed">Completed</button></div>
<div id="list" class="grid"></div>
</div>
</main>
</div>

<script>
const db=supabase.createClient('https://texzgslhswsyooixscmz.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRleHpnc2xoc3dzeW9vaXhzY216Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMDE2NDEsImV4cCI6MjEwNzY3NzY0MX0.Ui612PvVsw3jpT_WnR3U4ve8zNpYfcdHSd7KfuKv9U8');
let orders=[];
const $=id=>document.getElementById(id);
$('loginForm').onsubmit=async(e)=>{
  e.preventDefault();
  $('msg').textContent='Signing in...';
  const {error}=await db.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(), password:$('pass').value});
  if(error){ $('msg').innerHTML='<div style="background:#ffe6e6;padding:10px;border-radius:10px;color:#a00;font-size:13px">'+error.message+'</div>'; return; }
  openDash();
};
function openDash(){ $('loginPanel').classList.add('hidden'); $('dash').classList.remove('hidden'); load(); }
async function load(){
  const {data}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
  orders=data||[];
  const now=new Date(); const sToday=new Date(now.getFullYear(),now.getMonth(),now.getDate()); const sWeek=new Date(); sWeek.setDate(now.getDate()-7); const sMonth=new Date(now.getFullYear(),now.getMonth(),1); const sYesterday=new Date(sToday); sYesterday.setDate(sToday.getDate()-1);
  let cToday=0,cYest=0,cWeek=0,cLastWeek=0,cMonth=0,cLastMonth=0;
  orders.forEach(o=>{ const d=new Date(o.created_at); if(d>=sToday) cToday++; if(d>=sYesterday&&d<sToday) cYest++; if(d>=sWeek) cWeek++; if(d>=new Date(sWeek.getTime()-7*86400000)&&d<sWeek) cLastWeek++; if(d>=sMonth) cMonth++; });
  $('kpis').innerHTML=`
    <div class=kpi><small>Today</small><h2>${cToday}</h2><div style="color:#0a7a2e;font-weight:700;font-size:13px">↑ ${cToday-cYest>=0?'+':''}${cToday-cYest} vs yesterday</div></div>
    <div class=kpi><small>Week</small><h2>${cWeek}</h2><div style="color:#0a7a2e;font-weight:700;font-size:13px">↑ +${cWeek-cLastWeek>=0?cWeek-cLastWeek:0} vs last week</div></div>
    <div class=kpi><small>Month</small><h2>${cMonth}</h2><div style="color:#0a7f72;font-weight:700;font-size:13px">↑ +${cMonth} this month</div></div>
    <div class=kpi><small>Total Orders</small><h2>${orders.length}</h2><div style="color:#8a7f72;font-size:13px">All time</div></div>`;
  render();
}
function render(){
  const f=$('filter').value; let list=f==='all'?orders:orders.filter(o=>o.status===f);
  if(!list.length){ $('list').innerHTML='<div style="grid-column:1/-1;padding:30px;text-align:center;color:#8a7f72">No orders in '+f+'</div>'; return; }
  $('list').innerHTML=list.map(o=>{
    const items=(o.item_details||[]).map(i=>`${i.quantity}× ${i.name}`).join(' • ')||(o.items||'Items');
    const shortId='#'+String(o.id).slice(0,5);
    return `<div class=ocard>
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge b-${o.status}">${o.status}</span><small style="color:#8a7f72">${shortId}</small></div>
      <div style="font-weight:800;font-size:18px;margin:10px 0 2px">${o.customer_name||'Customer'}</div>
      <div style="font-size:13px;color:#8a7f72">📞 ${o.phone||'no phone'} • ${new Date(o.created_at).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'})}</div>
      <div style="font-size:13px;margin:10px 0 6px;color:#5a4e43">Items: ${items}</div>
      <div style="font-weight:800;font-size:18px;margin:8px 0">R ${Number(o.total||0).toFixed(2)}</div>
      ${o.status==='completed'?`<div style="background:#111;color:#fff;padding:10px;border-radius:999px;text-align:center;font-weight:800">✓ DONE</div>`:`<button class=btn-done onclick="doneOrder('${o.id}')">DONE → WhatsApp</button>`}
    </div>`;
  }).join('');
}
window.doneOrder=async(id)=>{
  const o=orders.find(x=>x.id===id);
  await db.from('orders').update({status:'completed'}).eq('id',id);
  let phone=(o.phone||'').replace(/\D/g,''); if(phone.startsWith('0')) phone='27'+phone.substring(1);
  const items=(o.item_details||[]).map(i=>`• ${i.quantity}x ${i.name}`).join('\n')||'Your order';
  const msg=`Hi ${o.customer_name}! 👋\n\nYour order from *Maggie's Treat* is DONE! 🎉\n\n${items}\n\nTotal: R${Number(o.total).toFixed(2)}\n\nReady for collection / delivery! Thank you 🧁`;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');
  load();
};
$('filter').onchange=render;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); $('filter').value=t.dataset.f; render();});
$('export').onclick=()=>{
  const csv=['Date,Customer,Phone,Total,Status',...orders.map(o=>`"${new Date(o.created_at).toLocaleString()}", "${o.customer_name}", "${o.phone||''}", ${o.total}, ${o.status}`)].join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='maggies-orders.csv'; a.click();
};
$('out').onclick=async()=>{await db.auth.signOut(); location.reload();};
(async()=>{ const {data:{session}}=await db.auth.getSession(); if(session) openDash(); })();
</script>
</body>
</html>
