<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Maggie's Treat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{margin:0;background:#fbf6ee;min-height:100vh}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.08);border:1px solid #f0e6d8}
.login-card input{width:100%;padding:15px;border-radius:14px;border:1.5px solid #f0e6d8;background:#fdfaf5;margin:8px 0 14px;font-size:15px}
.btn{width:100%;padding:15px;border-radius:999px;background:#ff7900;color:#fff;border:0;font-weight:800;cursor:pointer}
.card{background:#fff;border:1px solid #f0e6d8;border-radius:20px;padding:18px;margin:12px 0}
.order{border:1px solid #f0e6d8;border-radius:20px;padding:16px;margin:12px 0;background:#fff}
.btn-done{background:#111;color:#fff;border:0;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer}
.debug{white-space:pre-wrap;background:#111;color:#0f0;padding:12px;border-radius:12px;font-size:12px;margin:10px 0}
</style>
</head>
<body>

<div id="loginPanel" class="login-wrap">
<div class="login-card">
<h2 style="margin:0 0 6px">Welcome back.</h2>
<p style="color:#8a7f72;font-size:14px;margin:0 0 18px">Beautiful admin like customer site</p>
<div id="loginMessage"></div>
<pre id="debugBox" class="debug hidden"></pre>
<form id="loginForm">
<input id="loginEmail" type="email" value="plethabo434@gmail.com" required>
<input id="loginPassword" type="password" placeholder="Enter your password" required>
<button class="btn" type="submit" id="loginBtn">Sign in to dashboard →</button>
</form>
</div>
</div>

<div id="dashboardPanel" class="hidden">
<header style="padding:14px 20px;background:#fff;border-bottom:1px solid #f0e6d8;display:flex;justify-content:space-between"><b>MAGGIE'S TREAT</b><button id="logoutBtn" style="padding:8px 14px;border-radius:999px;border:1px solid #ddd;background:#fff">Log out</button></header>
<main style="max-width:1100px;margin:0 auto;padding:20px">
<h1>Store dashboard</h1>
<div id="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"></div>
<div class="card"><canvas id="revChart" height="90"></canvas></div>
<select id="filter" style="padding:10px 14px;border-radius:999px;margin:10px 0"><option value="all">All</option><option value="new">New</option><option value="completed">Completed</option></select>
<div id="ordersList"></div>
</main>
</div>

<script>
const db = supabase.createClient('https://texzgslhswsyooixscmz.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRleHpnc2xoc3dzeW9vaXhzY216Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMDE2NDEsImV4cCI6MjEwNzY3NzY0MX0.Ui612PvVsw3jpT_WnR3U4ve8zNpYfcdHSd7KfuKv9U8');
const $=id=>document.getElementById(id);
let orders=[],chart=null;

function showDebug(t){ const b=$('debugBox'); b.classList.remove('hidden'); b.textContent=t; }

$('loginForm').onsubmit=async(e)=>{
  e.preventDefault();
  $('loginMessage').innerHTML='Signing in...';
  showDebug('Trying to login with: '+$('loginEmail').value);
  const email=$('loginEmail').value.trim().toLowerCase();
  const password=$('loginPassword').value;
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error){
      $('loginMessage').innerHTML='<div style="background:#ffe6e6;color:#a00;padding:10px;border-radius:10px">'+error.message+'</div>';
      showDebug('ERROR: '+error.message+'\n\nFull: '+JSON.stringify(error,null,2));
      return;
    }
    showDebug('SUCCESS! User: '+data.user.email+'\nSession exists, opening dashboard...');
    openDash();
  }catch(err){
    showDebug('JS CRASH: '+err.message);
    $('loginMessage').innerHTML='<div style="background:#ffe6e6;color:#a00;padding:10px;border-radius:10px">'+err.message+'</div>';
  }
};

async function openDash(){
  $('loginPanel').classList.add('hidden');
  $('dashboardPanel').classList.remove('hidden');
  const {data:{session}}=await db.auth.getSession();
  showDebug('Session check: '+(session?'YES - '+session.user.email:'NO SESSION'));
  await load();
}
async function load(){
  $('ordersList').innerHTML='<div class=card>Loading...</div>';
  const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
  if(error){ $('ordersList').innerHTML='<div class=card style="background:#ffe6e6">DB Error: '+error.message+'</div>'; return; }
  orders=data||[];
  let today=0,cToday=0; const now=new Date(); const sToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  orders.forEach(o=>{const d=new Date(o.created_at); if(d>=sToday){today+=Number(o.total||0); cToday++;}});
  $('stats').innerHTML=`<div class=card><small>TODAY</small><h2>R ${today.toFixed(2)}</h2><small>${cToday} orders</small></div><div class=card><small>TOTAL</small><h2>${orders.length}</h2></div>`;
  if(chart) chart.destroy();
  const days=[...Array(7)].map((_,i)=>{const d=new Date(); d.setDate(d.getDate()-6+i); return d;});
  const rev=days.map(d=>{const s=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const e=new Date(s); e.setDate(s.getDate()+1); let sum=0; orders.forEach(o=>{const od=new Date(o.created_at); if(od>=s&&od<e) sum+=Number(o.total||0)}); return sum;});
  chart=new Chart($('revChart'),{type:'bar',data:{labels:days.map(d=>d.toLocaleDateString()),datasets:[{data:rev,backgroundColor:'#ff7900'}]},options:{plugins:{legend:{display:false}}}});
  render();
}
function render(){
  const f=$('filter').value; let list=f==='all'?orders:orders.filter(o=>o.status===f);
  if(!list.length){ $('ordersList').innerHTML='<div class=card>No orders</div>'; return; }
  $('ordersList').innerHTML=list.map(o=>`<div class=order><b>${o.customer_name}</b> - R${Number(o.total).toFixed(2)} - ${o.status} - ${o.phone||''}<br><small>${new Date(o.created_at).toLocaleString()}</small><div style="margin-top:10px">${o.status==='completed'?`<span style="background:#111;color:#fff;padding:8px 12px;border-radius:999px">✓ DONE</span>`:`<button class=btn-done onclick="doneOrder('${o.id}')">DONE → WhatsApp</button>`} <select onchange="updateStatus('${o.id}',this.value)"><option value="new" ${o.status==='new'?'selected':''}>New</option><option value="preparing" ${o.status==='preparing'?'selected':''}>Preparing</option><option value="ready" ${o.status==='ready'?'selected':''}>Ready</option><option value="completed" ${o.status==='completed'?'selected':''}>Completed</option></select></div></div>`).join('');
}
window.updateStatus=async(id,s)=>{await db.from('orders').update({status:s}).eq('id',id); load();};
window.doneOrder=async(id)=>{
  const o=orders.find(x=>x.id===id);
  await db.from('orders').update({status:'completed'}).eq('id',id);
  let phone=(o.phone||'').replace(/\D/g,''); if(phone.startsWith('0')) phone='27'+phone.substring(1);
  const msg=`Hi ${o.customer_name}! Your order from Maggie's Treat is DONE! Total R${o.total} - Ready for collection!`;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');
  load();
};
$('logoutBtn').onclick=async()=>{await db.auth.signOut(); location.reload();};
$('filter').onchange=render;

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session){ showDebug('Auto-login with existing session: '+session.user.email); openDash(); }
})();
</script>
</body>
</html>
